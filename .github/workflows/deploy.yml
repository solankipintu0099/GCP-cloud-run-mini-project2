name: Deploy to Cloud Run

# Push to main deploys to dev. Staging and prod are deployed from the
# Actions tab with "Run workflow"; give the prod GitHub Environment
# required reviewers so every prod deploy needs an approval.
on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to deploy
        type: choice
        options:
          - dev
          - staging
          - prod
        default: dev

permissions:
  contents: read

concurrency:
  group: deploy-${{ inputs.environment || 'dev' }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: app/requirements*.txt

      - name: Run tests
        working-directory: app
        run: |
          pip install -r requirements-dev.txt
          pytest -q

  deploy:
    needs: test
    runs-on: ubuntu-latest
    # Secrets come from this GitHub Environment, and GCP only accepts
    # tokens from the environment whose name matches the Terraform env.
    environment: ${{ inputs.environment || 'dev' }}
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker authentication
        run: gcloud auth configure-docker "${{ vars.GCP_REGION }}-docker.pkg.dev" --quiet

      - name: Build and push image
        env:
          IMAGE: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ vars.GCP_ARTIFACT_REPOSITORY }}/${{ vars.GCP_SERVICE_NAME }}:${{ github.sha }}
        run: |
          docker build -t "$IMAGE" ./app
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      # Who can invoke the service is managed by Terraform, so no --allow-unauthenticated here.
      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy "${{ vars.GCP_SERVICE_NAME }}" \
            --image "$IMAGE" \
            --region "${{ vars.GCP_REGION }}" \
            --project "${{ secrets.GCP_PROJECT_ID }}" \
            --service-account "cloudrun-demo-runtime@${{ secrets.GCP_PROJECT_ID }}.iam.gserviceaccount.com"
